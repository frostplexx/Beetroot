database_path: ./db.sqlite3
acoustid_api_key: XHzreNgplB
music_directory: ~/Music/Beetroot
lastfm_api_key: fad7b6b91a239d303f6a87f6ac8d3a20
path: '%bucket{$albumartist,alpha}/$albumartist/$album/$track $title'

reconcile_on_startup: true

# Duplicate Detection Configuration
# ---------------------------------
# duplicate_detection: Primary method for detecting duplicates
#   - 'mb_trackid': Use MusicBrainz Track ID (most reliable, requires tagged files)
#   - 'file_hash': Use SHA256 hash of file content (reliable, works without tags)
#   - 'path': Use file path only (least reliable, current behavior)
duplicate_detection: mb_trackid

# duplicate_action: What to do when duplicate detected
#   - 'skip': Keep existing record, ignore new import (safer, prevents data loss)
#   - 'overwrite': Replace existing record with new import (useful for metadata upgrades)
duplicate_action: skip

# compute_file_hash: Whether to compute SHA256 hashes
#   - true: Enable hash-based duplicate detection (adds ~10ms per file)
#   - false: Disable hashing for faster imports (falls back to mb_trackid/path)
compute_file_hash: true

watch_directories:
  - /Users/daniel/Music/Download
