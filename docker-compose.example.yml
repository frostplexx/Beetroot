services:
  beetroot:
    build:
      context: .
      dockerfile: Dockerfile
    image: beetroot:local
    container_name: beetroot
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${BEETROOT_PORT:-4433}:4433"
    environment:
      PORT: "4433"
      BEET_BIN_PATH: /usr/bin/beet
      BEET_WORKING_DIR: /config
      BEETSDIR: /config
      BEETSCONFIG: /config/config.yaml
      FRONTEND_DIST_DIR: /opt/beetroot/frontend/dist
    volumes:
      - ./example-data/config:/config
      - ./example-data/music:/music
    restart: unless-stopped
